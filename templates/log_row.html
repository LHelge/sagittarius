<tr data-show="($f_outcome === '' || $f_outcome === '{{ outcome_cat }}') && ($f_text === '' || '{{ search }}'.includes($f_text.toLowerCase()))">
  <td class="sgt-mono">{{ client }}</td>
  <td class="sgt-mono">{{ qname }}</td>
  <td>{{ qtype }}</td>
  <td><span class="sgt-badge {{ outcome_class }}">{{ outcome_label }}</span></td>
  <td class="sgt-num">{{ latency_ms }} ms</td>
  <td>
    {% if action_kind == "allow" %}
    <button class="sgt-btn-sm" data-on-click="@post('/log/whitelist?domain={{ qname }}', {headers: {'X-CSRF-Token': $csrf}})">Whitelist</button>
    {% else if action_kind == "deny" %}
    <button class="sgt-btn-sm secondary" data-on-click="@post('/log/blacklist?domain={{ qname }}', {headers: {'X-CSRF-Token': $csrf}})">Blacklist</button>
    {% else %}
    <span class="sgt-muted">—</span>
    {% endif %}
  </td>
</tr>
