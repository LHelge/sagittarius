<tr data-id="{{ id }}" data-outcome="{{ outcome_cat }}" data-search="{{ search }}"
    x-show="(f_outcome === '' || f_outcome === $el.dataset.outcome) && (f_text === '' || $el.dataset.search.includes(f_text.toLowerCase()))" x-cloak>
  <td class="sgt-mono">{{ client }}</td>
  <td class="sgt-mono">{{ qname }}</td>
  <td>{{ qtype }}</td>
  <td><span class="sgt-badge sgt-badge--{{ outcome_cat }}">{{ outcome_label }}</span></td>
  <td class="sgt-num">{{ latency_ms }} ms</td>
  <td>{{ action_html|safe }}</td>
</tr>
