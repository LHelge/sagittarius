# git-cliff configuration — generates release notes / CHANGELOG.md from
# Conventional Commits. Used by the release workflow (`--latest`) for the
# GitHub Release body, and runnable locally as `git cliff` to refresh
# CHANGELOG.md.
# https://git-cliff.org/docs/configuration

[changelog]
header = """
# Changelog

All notable changes to Sagittarius are documented here.\n
"""
body = """
{% if version %}\
## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}\
## [Unreleased]
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | upper_first }}
{% for commit in commits %}\
- {% if commit.scope %}**{{ commit.scope }}**: {% endif %}{{ commit.message | upper_first }}\
{% endfor %}
{% endfor %}\n
"""
footer = ""
trim = true

[git]
conventional_commits = true
filter_unconventional = true
split_commits = false
protect_breaking_commits = true
filter_commits = false
tag_pattern = "v[0-9].*"
topo_order = false
sort_commits = "oldest"

# Conventional-commit type → changelog group. Anything not matched is skipped.
commit_parsers = [
    { message = "^feat", group = "Added" },
    { message = "^fix", group = "Fixed" },
    { message = "^perf", group = "Performance" },
    { message = "^refactor", group = "Changed" },
    { message = "^docs", group = "Documentation" },
    { message = "^test", group = "Testing" },
    { message = "^ci", group = "CI" },
    { message = "^chore", skip = true },
    { message = "^build", skip = true },
    { body = ".*security", group = "Security" },
]
