[package]
name = "sagittarius"
version = "0.2.1"
edition = "2024"
description = "A fast, self-hosted DNS sinkhole in a single Rust binary"
license = "MIT OR Apache-2.0"
repository = "https://github.com/LHelge/sagittarius"
homepage = "https://github.com/LHelge/sagittarius"
readme = "README.md"
keywords = ["dns", "sinkhole", "adblock", "pi-hole", "resolver"]
categories = ["network-programming", "command-line-utilities"]

[dependencies]
anyhow = "1.0.102"
arc-swap = "1.9.1"
argon2 = "0.5.3"
askama = "0.16.0"
askama_web = { version = "0.16.0", features = ["axum-0.8"] }
async-stream = "0.3.6"
axum = "0.8.9"
bytes = "1.11.1"
clap = { version = "4.6.1", features = ["derive", "env"] }
datastar = { version = "0.3.1", features = ["axum"] }
governor = "0.10.4"
hickory-net = { version = "0.26", features = ["tls-ring", "https-ring", "webpki-roots"] }
hickory-proto = "0.26"
hmac = "0.13.0"
icondata_core = "0.1.0"
icondata_lu = "0.1.0"
moka = { version = "0.12.15", features = ["future"] }
rand = "0.10.1"
reqwest = { version = "0.13.4", default-features = false, features = ["rustls-no-provider", "gzip"] }
rustls = { version = "0.23.40", default-features = false, features = ["ring"] }
rustls-pki-types = "1.14.1"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
sha2 = "0.11.0"
socket2 = "0.6.4"
sqlx = { version = "~0.8", features = ["runtime-tokio", "sqlite", "macros", "migrate"] }
strum = { version = "0.28.0", features = ["derive"] }
thiserror = "2.0.18"
tokio = { version = "1.52.3", features = ["rt-multi-thread", "macros", "net", "signal", "time", "sync"] }
tokio-util = { version = "0.7.18", features = ["rt"] }
tower = { version = "0.5.3", features = ["limit", "load-shed", "timeout", "util"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"] }
url = "2.5.8"

[dev-dependencies]
flate2 = "1.1.9"
tempfile = "3.27.0"
wiremock = "0.6.5"
